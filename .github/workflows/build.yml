name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'

      - name: Configure
        run: cmake -S src -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Stage with Qt runtime
        run: cmake --install build --config Release --prefix stage

      - name: Package portable zip
        run: Compress-Archive -Path stage/* -DestinationPath SpeedCrunch-windows-x64-portable.zip

      - name: Build installer
        run: iscc pkg\winsetup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            SpeedCrunch-windows-x64-portable.zip
            pkg/SpeedCrunch-windows-x64-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build -j3

      - name: Package app bundle
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/SpeedCrunch.app -always-overwrite
          codesign --force --deep --sign - build/SpeedCrunch.app
          ditto -c -k --keepParent build/SpeedCrunch.app SpeedCrunch-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: SpeedCrunch-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-x64/*.zip
            windows-x64/*.exe
            macos-arm64/*.zip

